<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMin slice" role="img" aria-label="Morning classroom with chalkboard and desk">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6E8"/>
      <stop offset="0.62" stop-color="#F3ECD6"/>
      <stop offset="1" stop-color="#E9DCC0"/>
    </linearGradient>
    <linearGradient id="daylight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFDF2" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B47C"/>
      <stop offset="0.14" stop-color="#C69E62"/>
      <stop offset="1" stop-color="#8A6535"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4A38"/>
      <stop offset="1" stop-color="#1E3529"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="706" fill="url(#wall)"/>
  <rect x="980" y="0" width="620" height="706" fill="url(#daylight)"/>
  <g>
    <rect x="150" y="46" width="1180" height="330" rx="6" fill="#A97F45"/>
    <rect x="164" y="60" width="1152" height="302" rx="3" fill="url(#board)"/>
    <text x="220" y="150" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#F2EDE0" opacity="0.5">How memory forms</text>
    <text x="220" y="196" font-family="Georgia, serif" font-size="22" fill="#F2EDE0" opacity="0.32">encoding · storage · retrieval</text>
    <text x="220" y="238" font-family="Georgia, serif" font-size="22" fill="#F2EDE0" opacity="0.25">spacing · sleep · self-test</text>
    <rect x="150" y="376" width="1180" height="12" fill="#8A6535"/>
    <rect x="560" y="364" width="52" height="10" rx="2" fill="#EDE6D2" opacity="0.8"/>
    <rect x="624" y="360" width="64" height="16" rx="2" fill="#5C4A2E" opacity="0.85"/>
  </g>
  <rect x="0" y="700" width="1600" height="200" fill="url(#oak)"/>
  <rect x="0" y="700" width="1600" height="12" fill="#E4C48D"/>
  <line x1="0" y1="712" x2="1600" y2="712" stroke="#7A5F36" stroke-width="2" opacity="0.55"/>
  <ellipse cx="800" cy="722" rx="560" ry="20" fill="#3A2E18" opacity="0.22"/>
</svg>

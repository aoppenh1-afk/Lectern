name: macOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show macOS / Xcode / SDK
        run: |
          set -euo pipefail
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --show-sdk-version
          xcrun --sdk macosx --show-sdk-path
          echo "Available Xcode apps:"
          ls /Applications | grep -i Xcode || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test release signing policy
        run: |
          bash scripts/test-release-signing.sh
          bash scripts/test-dev-release-signing.sh

      - name: Build Lectern
        run: |
          set -euo pipefail
          # CI uses unsigned Debug builds; release signing in scripts/build-app.sh is maintainer-only.
          xcodebuild \
            -scheme Lectern \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Test Lectern
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme Lectern \
            -destination 'platform=macOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            test

      - name: Test Word and PDF exports
        run: bash scripts/test-document-export.sh

  hosted-connector:
    name: Hosted connector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:hosted
      - name: Test website downloads and demo
        run: |
          node scripts/test-website-download.mjs
          node scripts/test-website-state.mjs
          node scripts/test-website-story.mjs
      - run: npm run build

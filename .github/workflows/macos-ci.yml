name: macOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          set -euo pipefail
          echo "Available Xcode apps:"
          ls /Applications | grep -i Xcode || true
          # Prefer Xcode 26 if present; otherwise use the active/default toolchain.
          if [[ -d "/Applications/Xcode_26.app" ]]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          elif [[ -d "/Applications/Xcode-26.0.app" ]]; then
            sudo xcode-select -s /Applications/Xcode-26.0.app
          fi
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Lectern
        run: |
          set -euo pipefail
          # CI uses unsigned Debug builds; release signing in scripts/build-app.sh is maintainer-only.
          xcodebuild \
            -scheme Lectern \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Test Lectern
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme Lectern \
            -destination 'platform=macOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            test

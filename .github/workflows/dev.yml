name: Dev builds

# Every commit on main ships a dev-channel prerelease (stable releases are
# still cut by hand with scripts/release.sh and are the only thing the
# stable update channel sees). The version-bump commit that release.sh
# pushes back to main is skipped here so a stable release does not
# immediately spawn a duplicate dev build of the same code.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  publish-dev:
    # Stable release commits ("Release x.y.z") are excluded; manual runs
    # always publish.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release '))
    name: Publish dev prerelease
    environment: release-signing
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional: the shared desktop OAuth client from README.md so dev builds
      # keep Google Docs working. These are plain variables, NOT secrets: the
      # same values already ship in every stable build's Info.plist and are
      # extractable from the app, so there is nothing confidential to protect.
      # Without them dev builds report Google Docs as unavailable.
      LECTERN_GOOGLE_CLIENT_ID: ${{ vars.LECTERN_GOOGLE_CLIENT_ID }}
      LECTERN_GOOGLE_CLIENT_SECRET: ${{ vars.LECTERN_GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Import original release signing identity
        timeout-minutes: 3
        env:
          SIGNING_P12_BASE64: ${{ secrets.LECTERN_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.LECTERN_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$SIGNING_P12_BASE64" || -z "$SIGNING_P12_PASSWORD" ]]; then
            echo '::error::Configure LECTERN_SIGNING_P12_BASE64 and LECTERN_SIGNING_P12_PASSWORD in the release-signing environment using the original release certificate. Ad-hoc updates reset recording permissions.'
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/lectern-signing.keychain-db"
          P12_PATH="$RUNNER_TEMP/lectern-signing.p12"
          CERT_PATH="$RUNNER_TEMP/lectern-signing.pem"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security find-certificate -c 'Lectern Release Signing' -p "$KEYCHAIN_PATH" > "$CERT_PATH"
          source scripts/release-signing.sh
          FINGERPRINT="$(openssl x509 -in "$CERT_PATH" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          [[ "$FINGERPRINT" == "$LECTERN_RELEASE_CERTIFICATE" ]] || { echo '::error::Wrong release certificate'; exit 1; }
          # User trust changes can wait for a GUI authorization dialog. This
          # disposable hosted runner permits noninteractive admin trust setup.
          echo 'Trusting verified release certificate on the temporary runner'
          sudo -n security add-trusted-cert -d -r trustRoot -p codeSign -k "$KEYCHAIN_PATH" "$CERT_PATH"
          REQUIRE_CODE_SIGN_IDENTITY=1 resolve_lectern_signing_identity
          rm -f "$P12_PATH"

      - name: Show macOS / Xcode / SDK
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          git log --oneline -3

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Publish dev prerelease
        run: |
          set -euo pipefail
          scripts/release-dev.sh

      # GitHub destroys this hosted runner VM, including its signing keychain
      # and certificate trust, after the job. Explicit security cleanup can
      # hang waiting for macOS authorization after the release is published.
      # Revisit cleanup if this job ever moves to a self-hosted runner.

name: Lectern
options:
  bundleIdPrefix: com.lectern
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultSettings: recommended
packages:
  ParakeetTDT:
    path: Vendor/ParakeetTDT
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS.git
    from: "1.7.6"
settings:
  base:
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Single source of truth for the app version. scripts/release.sh bumps
    # these, tags the commit, and publishes the matching GitHub release.
    MARKETING_VERSION: "2.3"
    CURRENT_PROJECT_VERSION: "20"
targets:
  Lectern:
    type: application
    platform: macOS
    sources:
      - Sources/Lectern
      - path: Resources
        buildPhase: resources
      # Agent skills ship inside the bundle as folder references so
      # LecternAgentSkill.bundledURL finds Resources/<skill>/SKILL.md.
      - path: .agents/skills/lectern-transcription
        type: folder
        buildPhase: resources
      - path: .agents/skills/lectern-notes
        type: folder
        buildPhase: resources
    dependencies:
      - package: ParakeetTDT
        product: ParakeetTDT
      - package: AppAuth
        product: AppAuth
    settings:
      base:
        PRODUCT_NAME: Lectern
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          SWIFT_OPTIMIZATION_LEVEL: -Onone
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Lectern
        CFBundleName: Lectern
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # GitHub "owner/repo" the in-app updater polls for releases.
        LecternUpdateRepository: aoppenh1-afk/Lectern
        # Baked-in dev identity for the dev update channel. Stable builds leave
        # both empty; scripts/release-dev.sh stamps the dev tag and commit SHA
        # so dev installs can tell whether a newer dev prerelease exists.
        LecternDevTag: $(LECTERN_DEV_TAG)
        LecternDevSHA: $(LECTERN_DEV_SHA)
        LecternGoogleOAuthClientID: $(LECTERN_GOOGLE_CLIENT_ID)
        LecternGoogleOAuthClientSecret: $(LECTERN_GOOGLE_CLIENT_SECRET)
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Lectern records your microphone during lectures so they can be transcribed and studied on this Mac.
        NSAudioCaptureUsageDescription: Lectern captures the audio your Mac is playing — Zoom, Meet, or a lecture video — so it can be transcribed and studied on this Mac. No video is stored.
        NSScreenCaptureUsageDescription: Lectern uses Screen Recording permission only to capture system audio from Zoom and other lecture playback. No screen video is recorded or saved.
        NSHumanReadableCopyright: ""
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.lectern.bundle
            UTTypeDescription: Lectern Lecture Bundle
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - lectern
        CFBundleDocumentTypes:
          - CFBundleTypeName: Lectern Lecture Bundle
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.lectern.bundle
  LecternTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LecternTests
      - path: Sources/Lectern
        excludes:
          - Assets.xcassets
    dependencies:
      - package: ParakeetTDT
        product: ParakeetTDT
      - package: AppAuth
        product: AppAuth
    settings:
      base:
        PRODUCT_NAME: LecternTests
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
schemes:
  Lectern:
    build:
      targets:
        Lectern: all
        LecternTests: [test]
    test:
      targets:
        - LecternTests
